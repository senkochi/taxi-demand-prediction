project:
  name: "Taxi Demand Prediction"
  version: "1.0"
  description: "Multiresolution taxi demand prediction with clustering methods"

data:
  raw_path: "./data/raw/"
  processed_path: "./data/processed/"
  output_path: "./data/outputs/"
  external_path: "./data/external/"
  
  # Data parameters (NYC taxi data: Jan 2019 - Jun 2020)
  date_range: ["2019-01-01", "2020-06-30"]
  sample_size: null  # limit for faster prototyping; set to null for full data
  
paths:
  scripts: "./scripts/"
  models: "./data/models/"
  logs: "./logs/"
  reports: "./reports/"

clustering:
  methods: ["method1", "method2", "method3"]
  
  method1:
    name: "Demand-Based Clustering"
    k_range: [3, 4, 5, 6, 7, 8]
    
  method2:
    name: "Mobility Pattern Clustering"
    k_range: [4, 5, 6, 7, 8]
    features: ["trip_count", "avg_distance", "avg_fare", "avg_passenger", "trip_duration"]
    
  method3:
    name: "OD-Flow Clustering"
    k_range: [4, 5, 6, 7, 8]

temporal_aggregation:
  buckets: [30]  # use a single bucket for faster experiment iteration

train_val_test:
  train_ratio: 0.85
  val_ratio: 0.08
  test_ratio: 0.07

model:
  architecture: "SSTZIP-GNN"
  hidden_dim: 32
  num_layers: 2
  dropout: 0.2
  
  training:
    batch_size: 128
    epochs: 30
    learning_rate: 0.001
    early_stopping_patience: 10
    device: "cuda"  # set to 'cuda' when running on GPU (Colab T4)
    num_workers: 8
    precision: 16
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1

evaluation:
  metrics: ["MAE", "RMSE", "MAPE", "zero_inflation_score"]
  time_buckets: [15, 30, 60]

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
